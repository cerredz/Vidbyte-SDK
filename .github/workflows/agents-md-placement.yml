name: AGENTS.md placement

# Runs Codex (gpt-6-luna, high effort) on every opened or updated pull request
# to move code the PR put in the wrong place, per the repo's AGENTS.md, and
# pushes the fix back to the PR branch. Codex only edits the working tree; this
# workflow commits and pushes. Instructions live in
# .github/prompts/agents-md-placement.md.
#
# Codex bills the owner's ChatGPT subscription, not an API key: the job runs on
# a self-hosted runner labelled `codex` whose .env sets CODEX_HOME to a ChatGPT
# `codex login` made for that runner alone. The runner takes one job at a time,
# so the auth.json Codex refreshes in place is never shared by concurrent jobs.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: agents-md-placement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  placement:
    name: AGENTS.md placement
    # Same-repo branches only: fork PRs get no secrets and cannot be pushed to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, codex]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CODEX_VERSION: 0.157.1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      # codex-action's drop-sudo protection does not apply outside the action,
      # so the runner user itself must be unprivileged.
      - name: Require an unprivileged runner user
        run: |
          if sudo -n true 2>/dev/null; then
            echo "::error::The runner user has passwordless sudo. Run the Codex runner as an unprivileged user."
            exit 1
          fi

      - name: Install Codex CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-audit --no-fund "@openai/codex@${CODEX_VERSION}"
          echo "$RUNNER_TEMP/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Require a ChatGPT Codex login
        run: |
          if [[ -z "${CODEX_HOME:-}" ]]; then
            echo "::error::Set CODEX_HOME in this runner's .env to a directory holding its own ChatGPT codex login."
            exit 1
          fi
          if ! codex login status 2>&1 | grep -q "Logged in using ChatGPT"; then
            echo "::error::No ChatGPT login in $CODEX_HOME. On the runner host, run: CODEX_HOME=$CODEX_HOME codex login --device-auth"
            exit 1
          fi

      - name: Build prompt
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            cat .github/prompts/agents-md-placement.md
            printf '\n## Pull request\n\nBase branch: %s\nChanges in scope: git diff %s...HEAD\n' "$BASE_REF" "$BASE_SHA"
          } > "$RUNNER_TEMP/prompt.md"

      - name: Run Codex
        run: |
          codex exec \
            --skip-git-repo-check \
            --ephemeral \
            --cd "$GITHUB_WORKSPACE" \
            --model gpt-6-luna \
            --config 'model_reasoning_effort="high"' \
            --config 'default_permissions=":workspace"' \
            --output-last-message "$RUNNER_TEMP/report.md" \
            - < "$RUNNER_TEMP/prompt.md"

      # PLACEMENT_PUSH_TOKEN (a fine-grained PAT with Contents: write) is optional.
      # Without it, the push uses GITHUB_TOKEN, which never triggers other
      # workflows, so required checks will not run on the relocation commit.
      # With it, CI runs normally and this workflow re-runs once as a no-op.
      - name: Commit and push relocations
        env:
          PUSH_TOKEN: ${{ secrets.PLACEMENT_PUSH_TOKEN || github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          git add -A
          if git diff --cached --quiet; then
            echo "No placement changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move PR code to the locations AGENTS.md assigns" -m "$(cat "$RUNNER_TEMP/report.md")"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "HEAD:${HEAD_REF}"
