# Installs the development toolchain the Claude pull-request agents need to run this
# repository's gate on a runner. It mirrors the install steps in ci.yml so an agent sees
# the same environment the required checks do, and it verifies nothing by itself.
name: Claude agent toolchain
description: Install Python 3.11 and the SDK's dev extra so Claude agents can run scripts/run_ci.py.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.11"
        cache: pip

    - name: Install development dependencies
      shell: bash
      run: python -m pip install -e ".[dev]"
