# Installs the development toolchain the Claude pull-request agents need to run this
# repository's gate on a runner. It mirrors the install steps in ci.yml so an agent sees
# the same environment the required checks do, and it verifies nothing by itself.
name: Claude agent toolchain
description: Install Python 3.11, the SDK's dev extra, and Semgrep so Claude agents can run scripts/run_ci.py and the static policy.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.11"
        cache: pip

    - name: Install development dependencies
      shell: bash
      run: python -m pip install -e ".[dev]"

    # The same pin static-policy.yml uses. pipx gives Semgrep an environment of its own, so
    # its dependencies never change the versions the SDK's tests run against.
    - name: Install Semgrep
      shell: bash
      run: pipx install semgrep==1.170.1
