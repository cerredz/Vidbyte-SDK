[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidbyte-sdk"
version = "0.1.0"
description = "Python SDK namespace scaffold for Vidbyte integrations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [
  { name = "Vidbyte" }
]
dependencies = [
  "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://vidbyte.ai"

[tool.setuptools.packages.find]
include = ["vidbyte*"]

[project.scripts]
vidbyte-mcp-server = "vidbyte.mcp_server.__main__:main"

[tool.setuptools.package-data]
"vidbyte.prompts.prompts" = ["*.json", "*/*.json", "*/*.md"]
