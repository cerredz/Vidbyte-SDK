[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidbyte-sdk"
version = "0.1.0"
description = "Python SDK for building, evaluating, and distributing AI agent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Vidbyte", email = "hello@vidbyte.ai" }
]
keywords = ["ai", "agents", "llm", "sdk", "mcp", "pipelines", "evals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2,<3",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://vidbyte.ai"
Source = "https://github.com/cerredz/Vidbyte-SDK"
"Bug Tracker" = "https://github.com/cerredz/Vidbyte-SDK/issues"

[tool.setuptools.packages.find]
include = ["vidbyte*"]

[project.scripts]
vidbyte-mcp-server = "vidbyte.mcp_server.__main__:main"

[tool.setuptools.package-data]
"vidbyte.prompts.prompts" = ["*.json", "*/*.json", "*/*.md"]
"vidbyte.paradigms.context_minimal_fanout.multiple_prompts" = ["*.md"]
